name: Deploy Staging (npm)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-stg:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build --config wrangler.stg.jsonc

      - name: Deploy to Cloudflare (Staging)
        run: npx wrangler deploy --config wrangler.stg.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
