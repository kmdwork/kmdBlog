name: Deploy Staging (Vinext)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-stg:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stg
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (Vinext staging)
        run: npm run build:vinext:stg

      - name: Deploy to Cloudflare (Staging)
        run: npx cf deploy --mode stg --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
